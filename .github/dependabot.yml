version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql*", "EFCore.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
