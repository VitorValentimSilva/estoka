version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql*", "EFCore.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
    ignore:
      # O projeto segue o .NET 10 (LTS): majors da Microsoft/EF Core/Npgsql vêm junto com a troca de TargetFramework.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Imagens acompanham o TargetFramework (net10.0); o .NET 11 é uma migração à parte.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
