# Blueprint do Render (https://render.com/docs/blueprint-spec)
# O banco fica no Neon (PostgreSQL serverless, região AWS us-east-1): cole a connection string em ConnectionStrings__Default.
services:
  - type: web
    name: estoka
    runtime: docker
    plan: free
    region: virginia           # região do Render mais próxima do Brasil; crie o Neon em AWS us-east-1 (N. Virginia)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live   # não consulta o banco: deixa o Neon suspender quando não há uso
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__Default
        sync: false            # postgresql://usuario:senha@host/neondb?sslmode=require
      - key: Demo__Enabled
        value: "true"
      - key: Demo__ResetHour
        value: "4"
      - key: Api__Key
        value: "estoka-demo-key"   # chave PÚBLICA da demo (só papel "Api": sem custo; dados resetados diariamente)
      - key: Api__ShowKeyInDocs
        value: "true"              # Scalar já vem com a chave preenchida. Em produção real: generateValue + "false"
      # - key: OTEL_EXPORTER_OTLP_ENDPOINT   # opcional: Grafana Cloud, Honeycomb, etc.
      #   sync: false
      - key: Branding__AuthorName
        value: "Vitor Valentim Silva"
      - key: Branding__AuthorUrl
        value: "https://github.com/VitorValentimSilva"
