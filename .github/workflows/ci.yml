name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build e testes (unitários + integração)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estoka
          POSTGRES_PASSWORD: estoka
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estoka" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ESTOKA_TEST_PG: Host=localhost;Username=estoka;Password=estoka;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build (warnings como erro em src/)
        run: dotnet build --no-restore -c Release
      - name: Testes com cobertura
        run: dotnet test --no-build -c Release --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Pacotes vulneráveis
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright) contra a imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estoka
          POSTGRES_PASSWORD: estoka
          POSTGRES_DB: estoka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estoka" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t estoka:ci .
      - name: Sobe o container (usuário não-root, PORT, URI de conexão)
        run: |
          docker run -d --name estoka --network host \
            -e PORT=8080 \
            -e ConnectionStrings__Default="postgresql://estoka:estoka@localhost:5432/estoka" \
            -e Database__RequireSsl=false -e Demo__Enabled=true \
            estoka:ci
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/health
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instala Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Fluxo do vendedor (login → pedido → confirmação → baixa de estoque)
        run: node tests/e2e/pedido-vendedor.cjs
        env:
          BASE_URL: http://localhost:8080
      - name: Logs do container
        if: failure()
        run: docker logs estoka
